# Game detection (PLAN.md §11.5): an exe is a game when its path contains
# one of `libraries` (unless it also contains one of `launchers`: the
# launchers live beside their games), or when its file name is in
# game-exes.toml.
#
# Matching is case-insensitive on the full path with `\` separators. Each
# library entry starts and ends with `\`, so it matches whole folder names
# only. Only `libraries` and `launchers` go here: builds up to 0.0.9 refuse
# any other key, and with it the whole signed pack bundle.

libraries = [
  '\steamapps\common\',
  '\epic games\',
  '\ea games\',
  '\origin games\',
  '\ubisoft game launcher\games\',
  '\riot games\',
  '\gog galaxy\games\',
  '\gog games\',
  '\xboxgames\',
  '\battle.net\games\',
  '\rockstar games\',
  '\amazon games\library\',
  '\itch\apps\',
  '\wargaming.net\games\',
  # Games whose exe names are too generic for game-exes.toml.
  '\call of duty\',
  '\warthunder\win64\',
  '\games\',
]

launchers = [
  '\epic games\launcher\',
  '\riot games\riot client\',
  '\rockstar games\launcher\',
  '\rockstar games\social club\',
]
