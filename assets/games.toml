# Game detection (PLAN.md §11.5): an exe is a game when its path contains
# one of `libraries` (unless it also contains one of `launchers`: the
# launchers live beside their games), or when its file name is in `exes`.
#
# Matching is case-insensitive on the full path with `\` separators. Each
# library entry starts and ends with `\`, so it matches whole folder names
# only. `exes` are file names only, for games that install anywhere.

libraries = [
  '\steamapps\common\',
  '\epic games\',
  '\ea games\',
  '\origin games\',
  '\ubisoft game launcher\games\',
  '\riot games\',
  '\gog galaxy\games\',
  '\gog games\',
  '\xboxgames\',
  '\battle.net\games\',
  '\rockstar games\',
  '\amazon games\library\',
  '\itch\apps\',
  '\wargaming.net\games\',
  '\games\',
]

launchers = [
  '\epic games\launcher\',
  '\riot games\riot client\',
  '\rockstar games\launcher\',
  '\rockstar games\social club\',
]

