# Known games by exe file name, wherever they're installed (PLAN.md §11.5):
# Battle.net, standalone and other installs outside a launcher library.
# Lowercase file names only, and only names no other program would use:
# a generic one (cod.exe, aces.exe) goes in games.toml as its folder.
#
# Kept apart from games.toml on purpose: builds up to 0.0.9 refuse any key
# they don't know in the game pack, and with it the whole signed bundle
# (sites and app families too). The bundle carries this file as its own
# `game_exes` key, which those builds ignore.

