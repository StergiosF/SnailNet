<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="Atkinson Hyperlegible Next, Segoe UI Variable Text, Segoe UI, system-ui, sans-serif">
<title>On a 20 Mbps line, Steam keeps 40% and YouTube 60% while both are busy; when the video pauses, Steam gets the whole line</title>
<defs><pattern id="lent" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#eab04e"/><rect width="7" height="14" fill="#d99a3a"/></pattern>
<radialGradient id="g1" cx="90%" cy="0%" r="80%"><stop offset="0" stop-color="#eab04e" stop-opacity=".12"/><stop offset="1" stop-color="#eab04e" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="80%"><stop offset="0" stop-color="#e8836a" stop-opacity=".1"/><stop offset="1" stop-color="#e8836a" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="420" rx="24" fill="#0e2b26"/><rect width="1280" height="420" rx="24" fill="url(#g1)"/><rect width="1280" height="420" rx="24" fill="url(#g2)"/><rect x="40" y="40" width="568" height="340" rx="16" fill="#143831"/><text x="68" y="86" font-size="22" font-weight="800" fill="#f3eee2" >Both busy</text><text x="68" y="114" font-size="15" font-weight="400" fill="#b8cbc4" >Each keeps its slice of the 20 Mbps line.</text><clipPath id="c40"><rect x="68" y="142" width="512" height="64" rx="14"/></clipPath><g clip-path="url(#c40)"><rect x="68" y="142" width="203.20000000000002" height="64" fill="#eab04e"/><text x="84" y="181" font-size="17" font-weight="800" fill="#0f2420" >Steam 40%</text><rect x="275.20000000000005" y="142" width="304.8" height="64" fill="#e8836a"/><text x="291.20000000000005" y="181" font-size="17" font-weight="800" fill="#0f2420" >YouTube 60%</text></g><rect x="68" y="238" width="40" height="40" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="76" y="246" width="24" height="24"/><text x="124" y="255" font-size="17" font-weight="700" fill="#f3eee2" >Steam</text><text x="124" y="275" font-size="15" font-weight="400" fill="#b8cbc4" >8.0 Mbps · using its whole slice, wants more</text><rect x="68" y="302" width="40" height="40" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="76" y="310" width="24" height="24"/><text x="124" y="319" font-size="17" font-weight="700" fill="#f3eee2" >YouTube</text><text x="124" y="339" font-size="15" font-weight="400" fill="#b8cbc4" >12.0 Mbps · using its whole slice</text><rect x="672" y="40" width="568" height="340" rx="16" fill="#143831"/><text x="700" y="86" font-size="22" font-weight="800" fill="#f3eee2" >Video paused</text><text x="700" y="114" font-size="15" font-weight="400" fill="#b8cbc4" >What YouTube doesn't use, Steam gets.</text><clipPath id="c672"><rect x="700" y="142" width="512" height="64" rx="14"/></clipPath><g clip-path="url(#c672)"><rect x="700" y="142" width="203.20000000000002" height="64" fill="#eab04e"/><text x="716" y="181" font-size="17" font-weight="800" fill="#0f2420" >Steam 40%</text><rect x="907.2" y="142" width="304.8" height="64" fill="url(#lent)"/><text x="923.2" y="181" font-size="17" font-weight="800" fill="#0f2420" >YouTube 60%</text></g><rect x="700" y="238" width="40" height="40" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="708" y="246" width="24" height="24"/><text x="756" y="255" font-size="17" font-weight="700" fill="#f3eee2" >Steam</text><text x="756" y="275" font-size="15" font-weight="400" fill="#b8cbc4" >20.0 Mbps · 12.0 Mbps of it is spare room</text><rect x="700" y="302" width="40" height="40" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="708" y="310" width="24" height="24"/><text x="756" y="319" font-size="17" font-weight="700" fill="#f3eee2" >YouTube</text><text x="756" y="339" font-size="15" font-weight="400" fill="#b8cbc4" >quiet right now · lending 12.0 Mbps it isn't using</text></svg>
