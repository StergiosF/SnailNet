ext><text x="768" y="272" font-size="13" font-weight="400" fill="#b8cbc4" >downloads step back.</text><rect x="986" y="152" width="222" height="136" rx="16" fill="#143831"/><rect x="1002" y="168" width="36" height="36" rx="10" fill="#1b443c"/><g transform="translate(1010 176) scale(0.8333333333333334)" color="#f3eee2"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="1002" y="232" font-size="16" font-weight="700" fill="#f3eee2" >Quiet downloads</text><text x="1002" y="254" font-size="13" font-weight="400" fill="#b8cbc4" >Downloads only use what</text><text x="1002" y="272" font-size="13" font-weight="400" fill="#b8cbc4" >nobody else wants.</text><rect x="284" y="310" width="514" height="386" rx="16" fill="#143831"/><text x="302" y="344" font-size="16" font-weight="700" fill="#f3eee2" >Using your internet</text><rect x="302" y="366" width="36" height="36" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="309.2" y="373.2" width="21.599999999999998" height="21.599999999999998"/><text x="352" y="381" font-size="15" font-weight="700" fill="#f3eee2" >YouTube</text><text x="352" y="400" font-size="13" font-weight="400" fill="#b8cbc4" >gets all it asks for</text><text x="658" y="390" font-size="15" font-weight="700" fill="#f3eee2" text-anchor="end">12.4</text><text x="662" y="390" font-size="12" font-weight="400" fill="#b8cbc4" >Mbps</text><rect x="706" y="369" width="74" height="30" rx="8" fill="#1b443c"/><g transform="translate(716 377) scale(0.5833333333333334)" color="#f3eee2"><path d="M13.5 3 5 13.5h6L10 21l9-11h-6z" fill="currentColor"/></g><text x="736" y="389" font-size="13" font-weight="700" fill="#f3eee2" >Boost</text><rect x="302" y="428" width="36" height="36" rx="8" fill="#f3eee2"/><image href="data:image/svg+xml;base64," x="309.2" y="435.2" width="21.599999999999998" height="21.599999999999998"/><text x="352" y="443" font-size="