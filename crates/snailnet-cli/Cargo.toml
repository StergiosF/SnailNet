[package]
name = "snailnet-cli"
description = "SnailNet developer CLI (Phase 0 spike)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
snailnet-core = { version = "0.0.1", path = "../snailnet-core" }
snailnet-engine = { version = "0.0.1", path = "../snailnet-engine" }
snailnet-win = { version = "0.0.1", path = "../snailnet-win" }

[lints]
workspace = true

[[bin]]
name = "snailnet"
path = "src/main.rs"
