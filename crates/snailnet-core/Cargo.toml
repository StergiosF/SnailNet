[package]
name = "snailnet-core"
description = "Pure SnailNet logic: scheduler, packet parsing, clock. No Windows APIs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
arc-swap = "1.9.5"
hkdf = "0.13.0"
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.4"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
