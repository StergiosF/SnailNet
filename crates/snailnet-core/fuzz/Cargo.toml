# Fuzz targets for the parsers that read untrusted packets (PLAN.md §8.1:
# "minimal hand-written parser; fuzzed"). Nightly only, and its own
# workspace, so stable `cargo test --workspace` never builds it.
# How to run: see README.md here.
[package]
name = "snailnet-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.snailnet-core]
path = ".."

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic"
path = "fuzz_targets/quic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false
