[package]
name = "snailnet-app"
description = "SnailNet tray app: Tauri 2 shell around the Svelte UI, a client of the service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "snailnet_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
snailnet-core = { path = "../../crates/snailnet-core" }
snailnet-ipc = { path = "../../crates/snailnet-ipc" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
# A second launch brings up the running app (it lives in the tray).
tauri-plugin-single-instance = "=2.5.5"
# Start with Windows: the per-user HKCU Run value (PLAN.md §4, §15).
tauri-plugin-autostart = "=2.7.0"
# App icons for the list (icon.rs): read with Win32 (the same windows
# version Tauri already pulls in), PNG-encoded, sent as data URLs.
base64 = "0.22.1"
png = "0.18.1"
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Services"] }

[lints]
workspace = true
