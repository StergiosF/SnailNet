[package]
name = "snailnet-app"
description = "SnailNet tray app: Tauri 2 shell around the Svelte UI, a client of the service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "snailnet_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
snailnet-core = { path = "../../crates/snailnet-core" }
snailnet-ipc = { path = "../../crates/snailnet-ipc" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
# A second launch brings up the running app (it lives in the tray).
tauri-plugin-single-instance = "=2.5.5"
# Same version Tauri already pulls in; WinRT for the accent colour and OS build.
windows = { version = "0.62.2", features = ["Foundation", "System_Profile", "UI", "UI_ViewManagement"] }

[lints]
workspace = true
