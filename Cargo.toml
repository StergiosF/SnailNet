[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.9"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
snailnet-core = { path = "crates/snailnet-core" }
snailnet-engine = { path = "crates/snailnet-engine" }
snailnet-service = { path = "crates/snailnet-service" }
snailnet-win = { path = "crates/snailnet-win" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1
